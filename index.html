<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>千川全域投流 · 知识看板</title>
<style>
  :root{
    --bg:#0a0d13; --ink:#e9edf5; --sub:#8b96ab; --faint:#5c6678;
    --line:#222b3d; --cmt:#828ea6;
    --c-big:#e7ebf3; --c-small:#828ea6;
    --blue:#5b9bff; --green:#3ed28a; --orange:#f5a04a; --red:#f0616d;
    --purple:#b48bf2; --cyan:#3fd0de; --gold:#ecc26a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:
      radial-gradient(1100px 560px at 82% -12%, #16223e 0%, transparent 58%),
      radial-gradient(820px 480px at -8% 8%, #1a1530 0%, transparent 52%),
      var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;font-size:14px}
  .wrap{width:100%;max-width:none;margin:0;padding:0 24px 90px}

  .bar{position:sticky;top:0;z-index:60;background:rgba(10,13,19,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 24px;margin:0 -24px 6px}
  .bar .logo{font-weight:800;font-size:14.5px;flex:1;background:linear-gradient(90deg,#7db0ff,#b48bf2);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{border:1px solid #2c3850;background:#151b28;color:var(--ink);padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--blue);color:#cfe0ff}
  .btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .cardbtn{display:none}.editing .cardbtn{display:inline-block}
  .status{font-size:12px;color:var(--sub);min-width:78px}
  .hint{font-size:11.5px;color:var(--faint);width:100%;margin-top:-1px}.hint b{color:var(--blue)}

  .hero{padding:20px 2px 4px}
  .hero h1{font-size:26px;margin:0;font-weight:800}
  .hero h1 b{background:linear-gradient(90deg,#5b9bff,#b48bf2,#3fd0de);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--sub);font-size:12.5px;margin:7px 0 0;max-width:760px}
  .summary{margin:12px 0 6px;background:linear-gradient(120deg,#141b2b,#16142a);border:1px solid #2c3850;border-radius:12px;padding:11px 14px;font-size:12.5px;color:#c7d0e0}
  .summary b{color:#9fc0ff}
  h3.sec{font-size:21px;color:#eef2fa;margin:24px 2px 10px;font-weight:800;letter-spacing:.5px;border-left:4px solid var(--blue);padding-left:11px}
  /* 分类（大标题）增删与整组拖动控件 */
  .sectools{display:none;margin-left:12px;vertical-align:middle}
  .editing .sectools,.layout .sectools{display:inline-block}
  .delsec{border:1px solid #3b2530;background:#261720;color:#ff8a93;border-radius:7px;
    padding:2px 9px;font-size:11px;line-height:1.3;cursor:pointer;font-weight:600}
  .delsec:hover{border-color:#f0616d;background:#341923}
  .dragsec{display:none;border:1px solid #34425d;background:#151b28;color:#b9cae6;border-radius:7px;
    padding:2px 9px;font-size:11px;line-height:1.3;cursor:grab;font-weight:650;touch-action:none;user-select:none}
  .layout .dragsec{display:inline-block}.layout .delsec{display:none}.dragsec:active{cursor:grabbing}
  h3.sec.catdragging{opacity:.45}
  h3.sec.catdropbefore{box-shadow:0 -3px 0 var(--blue)}
  h3.sec.catdropafter{box-shadow:0 3px 0 var(--blue)}
  .clr{font-size:11px;color:var(--sub);display:inline-flex;align-items:center;gap:3px;cursor:pointer}
  /* 隐藏云端历史里那颗多余的「+卡片」（顶栏已有，去重更清爽） */
  #content .contenttools{display:none!important}
  /* 占位提示：只在编辑时显示、一打字就消失（普通浏览看不到，干净） */
  .editing .ph:empty::before{content:attr(data-ph);color:var(--faint);font-weight:400;font-style:normal;opacity:.9;pointer-events:none}
  .editing .q b.ph,.editing .why .ph{display:inline-block;min-width:90px}
  /* 新增行：大字一整行、小字一整行。大点只属于大字，小点只属于小字 */
  ul.bul li:has(> .bigtext){padding-left:0}
  ul.bul li:has(> .bigtext)::before{content:none}
  ul.bul li .bigtext{display:block;position:relative;color:var(--c-big);font-size:13.5px;line-height:1.5;min-height:1.25em;padding-left:16px}
  ul.bul li .bigtext:not(:empty)::before{content:"•";position:absolute;left:2px;top:0;color:var(--ac,#7db0ff);font-size:13px;font-weight:800;line-height:1.5}
  ul.bul li .bigtext:empty{display:none}
  .editing ul.bul li .bigtext:empty{display:block}
  ul.bul li .subnote{display:block;color:var(--c-small);font-size:12px;line-height:1.45;position:relative;margin-left:18px;padding-left:16px}
  /* 小字行：只有自己的小灰点，不继承主列表的大点 */
  ul.bul li .subnote:not(:empty)::before{content:"•";position:absolute;left:4px;top:4px;color:var(--c-small);font-size:7px;font-weight:800;line-height:1}
  .editing ul.bul li .subnote.ph:empty::before{content:attr(data-ph);position:static;font-size:12px;font-weight:400;color:var(--faint)}
  ul.bul li .subnote:empty{display:none}
  .editing ul.bul li .subnote:empty{display:block}
  ul.bul li:has(.bigtext){position:relative;padding-right:26px}
  .editing ul.bul li:has(.bigtext)>.del{position:absolute;top:4px;right:2px;margin:0}
  .clr input[type=color]{width:22px;height:20px;border:1px solid #2c3850;border-radius:5px;background:none;padding:0;cursor:pointer}

  /* ===== 卡片瀑布流 ===== */
  .cards{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:flex-start}
  .card{width:320px;flex:0 0 auto;border-radius:14px;overflow:hidden;
    background:linear-gradient(180deg,#161c2a,#11151f);border:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.28)}
  /* 普通浏览时：过高的卡片限高、卡内出滚动条，看板更整齐（编辑时自动展开、不限高） */
  .card:not(.mcard){max-height:520px;overflow-y:auto;overflow-x:hidden}
  .editing .card,.layout .card{max-height:none}
  /* 自由画布：卡片绝对定位、可重叠、想放哪放哪（位置随云保存） */
  .cards.freecanvas{display:block;position:relative}
  .cards.freecanvas>.card{position:absolute;margin:0}
  .cards.freecanvas>.card:not(.mcard){max-height:none}
  .layout .cards.freecanvas{outline:1px dashed #243150;outline-offset:6px;border-radius:14px}
  @media(max-width:700px){.wrap{padding:0 16px 90px}.bar{padding:10px 16px;margin:0 -16px 6px}.card{width:100%}}
  /* 排版模式：顶部色条=拖动手柄、右下角缩放、卡内可滚动 */
  .layout .card{resize:both;overflow:auto;min-width:240px;min-height:96px}
  .layout .card.dragging{opacity:.5;outline:2px dashed var(--blue);outline-offset:2px}
  .layout .cards{min-height:96px}
  .layout .cards.carddrop{outline:2px dashed var(--blue);outline-offset:6px;background:rgba(91,155,255,.05);border-radius:14px}
  .layout .card>.top{height:22px;cursor:grab;position:sticky;top:0;z-index:4;
    display:flex;align-items:center;justify-content:center}
  .layout .card>.top::after{content:"⠿ 按住拖动排序";font-size:10px;font-weight:700;letter-spacing:1px;
    color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .layout .card>.top:active{cursor:grabbing}
  body.cardmoving,body.cardmoving *{user-select:none!important}
  body.cardmoving{cursor:grabbing}
  /* 滚动条美化（卡内 + 整页） */
  .card::-webkit-scrollbar{width:9px;height:9px}
  .card::-webkit-scrollbar-thumb{background:#2c3850;border-radius:6px;border:2px solid transparent;background-clip:content-box}
  .card::-webkit-scrollbar-thumb:hover{background:#3a4a6a;background-clip:content-box}
  .card::-webkit-scrollbar-track{background:transparent}
  .card{scrollbar-width:thin;scrollbar-color:#2c3850 transparent}
  .card.dragover{outline:2px dashed var(--blue);outline-offset:3px}
  /* 枝条拖拽吸附 */
  .layout .card li{cursor:grab}
  .layout .card li:active{cursor:grabbing}
  .card li.dragging{opacity:.4}
  .card li.dropbefore{box-shadow:inset 0 3px 0 0 var(--blue)}
  .card li.dropafter{box-shadow:inset 0 -3px 0 0 var(--blue)}
  .card li.dropinside{outline:1px dashed var(--green);outline-offset:2px;background:rgba(62,210,138,.08)}
  .branchghost{position:fixed;z-index:9999;max-width:420px;padding:6px 10px;border:1px solid var(--blue);
    border-radius:7px;background:#151b28;color:var(--ink);font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);
    pointer-events:none;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  ul.bul li ul{list-style:none;margin:4px 0 0;padding-left:18px}
  .card .top{height:3px;background:var(--g,linear-gradient(90deg,#5b9bff,#3fd0de))}
  .pad{padding:14px 16px 15px}
  .cardtools{display:none;float:right;margin:0 0 6px 8px}
  .editing .cardtools{display:block}
  .delcard{border:1px solid #3b2530;background:#261720;color:#ff8a93;border-radius:7px;
    padding:3px 8px;font-size:11px;line-height:1.3;cursor:pointer}
  .delcard:hover{border-color:#f0616d;background:#341923}
  .imgbox{position:relative;display:inline-block;width:220px;min-width:72px;min-height:54px;max-width:100%;
    margin:8px 8px 8px 0;border:1px solid #2c3850;border-radius:9px;background:#0f1420;vertical-align:top;
    box-shadow:0 6px 18px rgba(0,0,0,.22)}
  .imgbox img{display:block;width:100%;height:100%;max-width:none;border-radius:8px;object-fit:contain;cursor:zoom-in}
  .imgbox.thumb{width:160px;height:110px}
  .imgbox.fit{width:100%;height:auto}
  .imgbox.fit img{height:auto}
  .imgtools{display:none;position:absolute;top:6px;right:6px;z-index:5;gap:4px;padding:3px;border-radius:8px;
    background:rgba(10,13,19,.82);border:1px solid #2c3850;backdrop-filter:blur(8px)}
  .editing .imgbox .imgtools{display:flex}
  .imgtools button{border:1px solid #34425d;background:#151b28;color:#cbd6ea;border-radius:6px;padding:2px 6px;
    font-size:11px;line-height:1.4;cursor:pointer}
  .imgtools button:hover{border-color:var(--blue);color:#fff}
  .imghandle{display:none;position:absolute;z-index:4;width:10px;height:10px;border:1px solid #9fc0ff;
    border-radius:50%;background:#5b9bff;box-shadow:0 0 0 2px rgba(10,13,19,.85)}
  .editing .imgbox .imghandle{display:block}
  .imghandle.n{top:-5px;left:50%;transform:translateX(-50%);cursor:ns-resize}
  .imghandle.s{bottom:-5px;left:50%;transform:translateX(-50%);cursor:ns-resize}
  .imghandle.e{right:-5px;top:50%;transform:translateY(-50%);cursor:ew-resize}
  .imghandle.w{left:-5px;top:50%;transform:translateY(-50%);cursor:ew-resize}
  .imghandle.nw{left:-5px;top:-5px;cursor:nwse-resize}
  .imghandle.ne{right:-5px;top:-5px;cursor:nesw-resize}
  .imghandle.sw{left:-5px;bottom:-5px;cursor:nesw-resize}
  .imghandle.se{right:-5px;bottom:-5px;cursor:nwse-resize}
  .imglightbox{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;
    padding:34px;background:rgba(0,0,0,.82);backdrop-filter:blur(6px)}
  .imglightbox.on{display:flex}
  .imglightbox img{max-width:96vw;max-height:92vh;border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.5);background:#111}
  .imglightbox .close{position:fixed;top:18px;right:22px;border:1px solid #42506a;background:#151b28;color:#fff;
    border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;margin-bottom:9px;
    background:#1b2434;color:var(--ac,#7db0ff);border:1px solid #243150}
  .ti{font-size:17px;font-weight:800;margin:0 0 7px;line-height:1.35}
  .q{font-style:italic;color:#8ea0bd;font-size:12.5px;margin:0 0 10px}.q b{color:#bccbe6;font-style:normal}

  ul.bul{list-style:none;margin:0;padding:0}
  ul.bul li{position:relative;padding:5px 6px 5px 16px;font-size:13.5px;border-radius:7px;color:var(--c-big)}
  ul.bul li::before{content:"•";position:absolute;left:2px;top:5px;color:var(--ac,#7db0ff);font-weight:800}
  ul.bul li .wy{color:var(--c-small);font-size:12px}
  ul.bul li .wy::before{content:"— "}
  .editing ul.bul li:hover{background:#15203a}

  .pill{font-size:10px;padding:0 6px;border-radius:18px;margin-left:4px;vertical-align:middle;white-space:nowrap}
  .p-red{background:#39151b;color:#ff8a93}.p-org{background:#3a2a12;color:#ffc081}.p-grn{background:#10301f;color:#67e0a3}.p-blu{background:#15294a;color:#86b6ff}

  .why{margin-top:11px;background:#1a1320;border:1px solid #3a2230;border-left:3px solid var(--red);
    border-radius:9px;padding:9px 11px;font-size:12.5px;color:#cbb8c1}
  .why b{color:#ff8a93}

  .del{display:none;border:1px solid #2c3850;background:#241620;color:#ff8a93;width:19px;height:19px;border-radius:5px;
    cursor:pointer;font-size:11px;line-height:1;margin-left:5px;vertical-align:middle}
  .addrow{display:none;margin:5px 0 0 14px;border:1px dashed #2c3850;background:transparent;color:var(--sub);
    padding:3px 10px;border-radius:7px;font-size:11.5px;cursor:pointer}
  .addrow:hover{border-color:var(--green);color:#67e0a3}
  .editing .del{display:inline-block}.editing .addrow{display:inline-block}
  .editing #content{outline:2px dashed var(--blue);outline-offset:6px;border-radius:10px}
  .foot{text-align:center;color:var(--faint);font-size:12px;margin-top:32px}

  /* 因果链大卡 */
  .rootmap{margin:6px 0 10px;border-radius:14px;overflow:hidden;border:1px solid #3a2740;
    background:linear-gradient(180deg,#1a1322,#12121d)}
  .rootmap .top{height:3px;background:linear-gradient(90deg,#f0616d,#b48bf2,#5b9bff,#3ed28a)}
  .rootmap .pad{padding:14px 18px 16px}
  .rootmap h3.t{margin:0 0 3px;font-size:18px;font-weight:800}
  .rootmap .lead{color:#9aa6bd;font-size:12.5px;margin:0 0 12px}
  .roots{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
  @media(max-width:640px){.roots{grid-template-columns:1fr}}
  .root{border:1px solid #344056;border-radius:11px;padding:11px 13px;background:#141a28}
  .root .rh{font-weight:800;font-size:14px;margin-bottom:3px}
  .root.r1 .rh{color:#c4a4ff} .root.r2 .rh{color:#67dbe8}
  .root .rd{color:#9aa6bd;font-size:12.5px}
  .deriv{margin-top:10px}
  .deriv .gh{font-weight:700;font-size:13px;margin:10px 0 3px;color:#cdd7e8}
  .deriv .gh .em{font-weight:400;color:var(--cmt);font-size:11.5px}
  .chain{position:relative;padding:4px 0 4px 16px;font-size:13px;border-left:1.5px solid #344056;margin-left:6px}
  .chain b{color:#e9edf5}
  .chain .arr{color:#ff8a93;font-weight:700}
  .proof{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .proof .pc{font-size:11px;padding:2px 9px;border-radius:18px;background:#15294a;color:#86b6ff;border:1px solid #243150}
  .proof .pc b{color:#fff}
  .infer{margin-top:12px;background:#101f1a;border:1px solid #1f4733;border-left:3px solid #3ed28a;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#aee0c4}
  .infer b{color:#67e0a3}
  .infer .ln{margin:4px 0}

  /* 推导链卡片：竖向步骤 */
  .steps{margin:2px 0 0}
  .steps .st{position:relative;padding:5px 0 5px 16px;font-size:12.8px;color:var(--c-big);line-height:1.5}
  .steps .st::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1.5px;background:#33405a}
  .steps .st::after{content:"";position:absolute;left:4px;top:13px;width:9px;height:1.5px;background:#33405a}
  .steps .st:first-child{font-weight:700;color:#fff}
  .steps .st:first-child::before{top:13px}
  .steps .st:last-child::before{height:13px}
  .steps .st b{color:#fff}
  .ccl{margin-top:9px;background:#10261c;border:1px solid #1f4733;border-left:3px solid #3ed28a;border-radius:8px;padding:7px 10px;font-size:12px;color:#9ce7c0}
  .ccl b{color:#67e0a3}
  .twol .ln2{font-size:12.8px;margin:5px 0;color:var(--c-big)}.twol .ln2 b{color:#fff}

  /* 投流大模型 · 树 */
  .mcard{width:100%!important;flex:1 1 100%}
  .mtree{font-size:13px;margin-top:6px}
  .mtree ul{list-style:none;margin:0;padding-left:0}
  .mtree li{position:relative;padding:4px 0 4px 18px}
  .mtree li::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1.5px;background:#33405a}
  .mtree li::after{content:"";position:absolute;left:5px;top:13px;width:11px;height:1.5px;background:#33405a}
  .mtree li:last-child::before{height:13px}
  .mtree .nd{font-weight:600;color:var(--c-big)}
  .mtree .stg{font-weight:800;font-size:14px}
  .mtree .core{color:#ffd479;font-weight:700}
  .mtree .cm{color:var(--c-small);font-size:12px;margin-left:5px}
  .mtree .cm::before{content:"# "}

  /* 颜色主题 */
  .c-blue{--ac:#5b9bff;--g:linear-gradient(90deg,#5b9bff,#3fd0de)}
  .c-cyan{--ac:#3fd0de;--g:linear-gradient(90deg,#3fd0de,#3ed28a)}
  .c-green{--ac:#3ed28a;--g:linear-gradient(90deg,#3ed28a,#9be15d)}
  .c-orange{--ac:#f5a04a;--g:linear-gradient(90deg,#f5a04a,#f0616d)}
  .c-red{--ac:#f0616d;--g:linear-gradient(90deg,#f0616d,#b48bf2)}
  .c-purple{--ac:#b48bf2;--g:linear-gradient(90deg,#b48bf2,#5b9bff)}
  .c-gold{--ac:#ecc26a;--g:linear-gradient(90deg,#ecc26a,#f5a04a)}

  /* ===== 时间轴卡片：卡片 > 步骤 > 内容块 ===== */
  .timeline-card{width:420px;max-width:100%;min-width:280px;flex:0 0 auto;max-height:none!important;overflow:visible;
    container-type:inline-size;
    --tl-bg:#0d121c;--tl-panel:#151c28;--tl-axis:#8295b5;--tl-accent:#5b9bff;
    --tl-text:#edf1f8;--tl-muted:#8794aa;background:var(--tl-bg);color:var(--tl-text)}
  .timeline-card[data-font="serif"]{font-family:Georgia,"Songti SC","STSong",serif}
  .timeline-card[data-font="mono"]{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
  .timeline-card[data-size="small"]{font-size:12px}.timeline-card[data-size="large"]{font-size:16px}
  .timeline-card[data-space="tight"] .tl-section{padding-bottom:13px}
  .timeline-card[data-space="wide"] .tl-section{padding-bottom:31px}
  .timeline-card .timeline-pad{padding:26px 28px 30px;background:var(--tl-bg)}
  .tl-kicker{color:var(--tl-muted);font-size:.78em;font-weight:800;letter-spacing:1.5px;margin-bottom:5px}
  .timeline-card .tl-main-title{font-size:2em;margin:0 0 2px;color:var(--tl-text)}
  .tl-subtitle{color:var(--tl-muted);font-size:1.02em;font-weight:650;margin-bottom:18px}
  .tl-rootbox{display:flex;gap:12px;align-items:flex-start;margin:0 0 22px;padding:15px 18px;
    border:1px solid color-mix(in srgb,var(--tl-axis) 25%,transparent);border-radius:13px;background:var(--tl-panel)}
  .tl-rootdot{width:15px;height:15px;flex:0 0 15px;margin-top:5px;border-radius:50%;background:#f44755;
    box-shadow:0 0 0 5px rgba(244,71,85,.08)}
  .tl-roottitle{font-size:1.12em;font-weight:800;color:var(--tl-text)}
  .tl-rootnote{font-size:.88em;color:var(--tl-muted);margin-top:2px}
  .tl-track{position:relative;padding-left:47px}
  .tl-track::before{content:"";position:absolute;left:18px;top:5px;bottom:12px;width:2px;background:var(--tl-axis);opacity:.58}
  .tl-section{position:relative;padding:0 0 22px}
  .tl-node{position:absolute;left:-34px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--tl-axis);
    box-shadow:0 0 0 4px var(--tl-bg)}
  .tl-sectionhead{display:grid;grid-template-columns:auto minmax(180px,1fr) minmax(140px,.72fr);align-items:center;gap:10px;margin-bottom:10px}
  .tl-num{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:30px;padding:0 9px;
    border-radius:8px;background:color-mix(in srgb,var(--tl-accent) 24%,#111827);color:#dbe7ff;font-weight:850;font-size:1.05em}
  .tl-steptitle{font-size:1.25em;font-weight:850;color:var(--tl-text);line-height:1.3}
  .tl-purpose{text-align:right;color:var(--tl-muted);font-size:.82em;font-weight:650;line-height:1.35}
  .tl-modules{display:flex;flex-direction:column;gap:8px}
  .tl-module{position:relative;border:1px solid color-mix(in srgb,var(--tl-axis) 20%,transparent);border-radius:11px;
    background:var(--tl-panel);padding:12px 15px;color:var(--tl-text)}
  .tl-module.tl-flow{background:color-mix(in srgb,var(--tl-accent) 13%,var(--tl-panel));font-weight:750;color:#d9e6ff}
  .tl-module.tl-alert{background:#241f17;border-color:#4e3b1d;color:#e8bd62}
  .tl-module.tl-panel{border-left:3px solid var(--tl-accent)}
  /* 小树注释：不做大方框，只用细树枝承接上一模块 */
  .tl-module.tl-tree{padding:0 6px 0 17px;border:0;border-radius:0;background:transparent!important;color:var(--tl-muted)}
  .tl-tree-lines{position:relative}
  .tl-tree-line{position:relative;min-height:25px;padding:3px 0 3px 17px;color:var(--tree-color,var(--tl-muted));
    font-size:var(--tree-size,12px);line-height:1.55}
  .tl-tree-line::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.5px;background:color-mix(in srgb,var(--tl-axis) 58%,transparent)}
  .tl-tree-line::after{content:"";position:absolute;left:0;top:.9em;width:11px;height:1.5px;background:color-mix(in srgb,var(--tl-axis) 58%,transparent)}
  .tl-tree-line:last-child::before{bottom:auto;height:.9em}
  .tl-tree-text{display:block;min-height:1.35em}
  .tl-tree-linetools{display:none;position:absolute;right:0;top:0;align-items:center;gap:3px;z-index:2}
  .editing .timeline-card .tl-tree-linetools{display:flex}
  .editing .timeline-card .tl-tree-line{padding-right:120px}
  .tl-tree-linetools input[type=color]{width:25px;height:23px;padding:0;border:0;background:transparent;cursor:pointer}
  .tl-tree-linetools input[type=number]{width:43px;height:23px;padding:1px 3px;border:1px solid #34425d;border-radius:5px;
    background:#151b28;color:#dce5f5;font-size:11px;text-align:center}
  .tl-tree-linetools .treeunit{color:var(--tl-muted);font-size:9px;margin-left:-3px}
  .tl-tree-linetools button{border:1px solid #4b2931;background:#241620;color:#ff9098;border-radius:5px;height:23px;cursor:pointer}
  .editing .tl-module.tl-tree{margin-top:12px}
  .editing .timeline-card .tl-tree>.tl-moduletools{left:-17px;right:auto;top:-15px}
  .tl-line{position:relative;padding:3px 22px 3px 16px;line-height:1.55}
  .tl-line::before{content:"";position:absolute;left:1px;top:.82em;width:5px;height:5px;border-radius:50%;background:var(--tl-accent)}
  .tl-line .tl-del-line{display:none;position:absolute;right:0;top:2px}
  .tl-flowtext,.tl-alerttext,.tl-paneltext{min-height:1.4em;line-height:1.55}
  .tl-alerttext::before{content:"⚠ ";font-weight:900}
  .tl-editbar,.tl-sectiontools,.tl-moduletools,.tl-stylepanel{display:none}
  .editing .timeline-card .tl-editbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;clear:both}
  .editing .timeline-card .tl-sectiontools{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 0}
  .editing .timeline-card .tl-moduletools{display:flex;position:absolute;right:7px;top:-12px;gap:4px;z-index:3}
  .editing .timeline-card .tl-stylepanel.open{display:flex;gap:9px;flex-wrap:wrap;align-items:end;margin:0 0 14px;
    padding:10px;border:1px solid #2d3a52;border-radius:10px;background:#101621}
  .tl-editbar button,.tl-sectiontools button,.tl-moduletools button,.tl-stylepanel button{border:1px solid #34425d;
    background:#151b28;color:#cbd6ea;border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer}
  .tl-editbar button:hover,.tl-sectiontools button:hover,.tl-moduletools button:hover{border-color:var(--tl-accent);color:#fff}
  .tl-sectiontools .danger,.tl-moduletools .danger{color:#ff9098;border-color:#4b2931}
  .tl-drag{cursor:grab;touch-action:none;user-select:none}.tl-drag:active{cursor:grabbing}
  .tl-pointer-dragging{opacity:.48}
  .tl-stylepanel label{display:flex;flex-direction:column;gap:3px;color:var(--tl-muted);font-size:10px}
  .tl-stylepanel input[type=color]{width:34px;height:26px;border:1px solid #34425d;border-radius:6px;background:#111;padding:1px}
  .tl-stylepanel select{height:27px;border:1px solid #34425d;border-radius:6px;background:#151b28;color:#dce5f5;font-size:11px}
  .editing .timeline-card .tl-line .tl-del-line{display:block;border:0;background:transparent;color:#ff9098;cursor:pointer}
  .editing .timeline-card [data-ph]:empty{min-width:80px;min-height:1.3em;outline:1px dashed rgba(91,155,255,.25);border-radius:4px}
  .editing .timeline-card [data-ph]:empty::before{content:attr(data-ph);color:#68758c;font-weight:400}
  .timeline-card .tl-drop-before{box-shadow:0 -3px 0 var(--tl-accent)}
  .timeline-card .tl-drop-after{box-shadow:0 3px 0 var(--tl-accent)}
  .layout .timeline-card{resize:both;overflow:auto;min-width:280px;min-height:180px}
  @container (max-width:520px){
    .timeline-card .timeline-pad{padding:20px 16px 24px}.tl-track{padding-left:32px}.tl-track::before{left:10px}
    .tl-node{left:-26px}.tl-sectionhead{grid-template-columns:auto 1fr}.tl-purpose{grid-column:2;text-align:left}
    .timeline-card .tl-main-title{font-size:1.65em}
  }
  @media(max-width:700px){
    .timeline-card .timeline-pad{padding:20px 16px 24px}.tl-track{padding-left:32px}.tl-track::before{left:10px}
    .tl-node{left:-26px}.tl-sectionhead{grid-template-columns:auto 1fr}.tl-purpose{grid-column:2;text-align:left}
    .timeline-card .tl-main-title{font-size:1.65em}
  }
</style>
</head>
<body>
<div class="wrap">

  <style>
    .searchbox{flex:0 1 240px;min-width:120px;background:#0f1622;border:1px solid #2c3850;color:var(--ink);padding:6px 10px;border-radius:8px;font-size:13px;outline:none}
    .searchbox::placeholder{color:var(--faint)}
    .searchbox:focus{border-color:var(--blue)}
    .searchcount{font-size:12px;color:var(--sub);white-space:nowrap}
    #content .card.search-dim{opacity:.12;filter:grayscale(.6);transition:opacity .15s}
    #content .card.search-hit{outline:2px solid var(--gold);outline-offset:2px;border-radius:10px}
    #content .search-texthit{background:rgba(236,194,106,.22);box-shadow:0 0 0 2px rgba(236,194,106,.5) inset;border-radius:4px}
    #content .search-imghit{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 12px rgba(236,194,106,.65)}
  </style>
  <div class="bar">
    <span class="logo">⚡ 千川全域投流 · 知识看板</span>
    <input id="searchBox" class="searchbox" type="search" placeholder="🔍 搜文字 / 图里的字…" oninput="doSearch(this.value)">
    <span class="searchcount" id="searchCount"></span>
    <button class="btn" id="editBtn" onclick="toggleEdit()">📝 编辑</button>
    <button class="btn cardbtn" onclick="addCard()">＋ 卡片</button>
    <button class="btn cardbtn" onclick="addTimelineCard()">＋ 时间轴卡片</button>
    <button class="btn cardbtn" onclick="addSection()">＋ 分类</button>
    <button class="btn" id="layoutBtn" onclick="toggleLayout()">🔧 排版</button>
    <button class="btn" onclick="saveCloud()">☁️ 保存到云端</button>
    <button class="btn" onclick="location.reload()">⟳ 重载</button>
    <span class="status" id="status"></span>
    <span class="hint">📝<b>编辑</b>：直接改文字或增减内容。🔧<b>排版</b>：“拖分类”会带着本类全部卡片移动；卡片顶部可单独拖动，右下角可缩放。改完点☁️保存。</span>
  </div>

  <div id="content">
    <div id="loadingNote" style="padding:40px 24px;color:#888;font-size:15px">⌛ 正在从 GitHub 载入内容…</div>
  </div>

  <div class="foot">10 篇全部串联 · 卡片式 · 可增删行 · 可云保存 · 改完点「保存到云端」</div>
</div>

<script>
  let editing=false, layout=false;
  function toggleEdit(){
    if(layout) toggleLayout();           // 进文字编辑前先退排版
    editing=!editing;
    ensureCardControls();
    ensureSectionControls();
    ensureTimelineControls();
    normalizeRows();
    document.getElementById('content').contentEditable=editing;
    document.body.classList.toggle('editing',editing);
    const b=document.getElementById('editBtn');
    b.classList.toggle('on',editing);
    b.textContent=editing?'✅ 完成':'📝 编辑';
    setStatus(editing?'编辑中…点文字直接改；粘贴自动套用大字/小字':'');
  }
  function toggleLayout(){
    if(editing) toggleEdit();             // 进排版前先退文字编辑
    layout=!layout;
    ensureSectionControls();
    document.body.classList.toggle('layout',layout);
    const b=document.getElementById('layoutBtn');
    b.classList.toggle('on',layout);
    b.textContent=layout?'✅ 完成排版':'🔧 排版';
    syncLayoutDraggables();
    clearDropMarks();
    setStatus(layout?'排版中…“拖分类”会带着本类全部卡片移动；卡片顶部可单独拖动，右下角可缩放':'');
  }
  // 拖动换位：卡片、任意层级枝条分开处理
  let dragEl=null, dragType='';
  function syncLayoutDraggables(){
    // 卡片改用「顶部色条手柄 + 指针拖动」，关掉原生拖拽避免和缩放/选区打架
    document.querySelectorAll('.card').forEach(c=>c.draggable=false);
    document.querySelectorAll('.card li').forEach(li=>li.draggable=layout);
  }
  /* ===== 自由画布：抓顶部色条自由摆放，也可拖到其他分类 ===== */
  let cardDrag=null;
  // 第一次在某个分类里拖卡片时，把这一组「冻结」成自由画布：所有卡片就地变绝对定位，谁也不挤谁
  function freezeGroup(group){
    if(group.classList.contains('freecanvas')) return;
    const gr=group.getBoundingClientRect();
    const cards=Array.prototype.filter.call(group.children,c=>c.classList&&c.classList.contains('card'));
    const snap=cards.map(c=>{const r=c.getBoundingClientRect();return {c,left:r.left-gr.left,top:r.top-gr.top,w:r.width};});
    group.classList.add('freecanvas');
    snap.forEach(p=>{
      p.c.style.position='absolute';
      p.c.style.left=Math.round(p.left)+'px';
      p.c.style.top=Math.round(p.top)+'px';
      p.c.style.width=Math.round(p.w)+'px';
      p.c.style.margin='0';
    });
    fitGroupHeight(group);
  }
  function fitGroupHeight(group){
    let mb=120;
    Array.prototype.forEach.call(group.children,c=>{if(c.classList&&c.classList.contains('card'))mb=Math.max(mb,c.offsetTop+c.offsetHeight);});
    group.style.height=Math.round(mb+24)+'px';
  }
  function cardDropGroup(x,y){
    return Array.from(document.querySelectorAll('#content .cards')).find(group=>{
      const r=group.getBoundingClientRect();
      return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
    })||null;
  }
  function markCardDrop(group){
    document.querySelectorAll('#content .cards.carddrop').forEach(g=>g.classList.remove('carddrop'));
    if(group)group.classList.add('carddrop');
  }
  function sectionName(group){
    const h=group&&group.previousElementSibling;
    return h&&h.matches('h3.sec')?(h.textContent||'').replace(/⠿ 拖分类|删分类/g,'').trim():'';
  }
  document.addEventListener('pointerdown',e=>{
    if(!layout||e.button!==0)return;
    const top=e.target.closest('.top');
    if(!top)return;
    const card=top.parentElement;
    if(!card||!card.classList.contains('card'))return;
    const group=card.parentElement;
    if(!group||!group.classList.contains('cards'))return;
    freezeGroup(group);
    const cr=card.getBoundingClientRect();
    cardDrag={card,group,offX:e.clientX-cr.left,offY:e.clientY-cr.top,moved:false,dropGroup:group};
    card.style.position='fixed';
    card.style.left=Math.round(cr.left)+'px';
    card.style.top=Math.round(cr.top)+'px';
    card.style.width=Math.round(cr.width)+'px';
    card.classList.add('dragging');
    card.style.zIndex='999';
    document.body.classList.add('cardmoving');
    if(top.setPointerCapture){try{top.setPointerCapture(e.pointerId);}catch(_){}}
    e.preventDefault();e.stopPropagation();
  },true);
  document.addEventListener('pointermove',e=>{
    if(!cardDrag)return;
    e.preventDefault();
    if(e.clientY>window.innerHeight-60)window.scrollBy(0,20);
    else if(e.clientY<72)window.scrollBy(0,-20);
    let nl=e.clientX-cardDrag.offX;
    let nt=e.clientY-cardDrag.offY;
    cardDrag.card.style.left=Math.round(nl)+'px';
    cardDrag.card.style.top=Math.round(nt)+'px';
    cardDrag.dropGroup=cardDropGroup(e.clientX,e.clientY);
    markCardDrop(cardDrag.dropGroup);
    cardDrag.moved=true;
  },true);
  document.addEventListener('pointerup',e=>{
    if(!cardDrag)return;
    const source=cardDrag.group;
    const target=cardDrag.dropGroup||source;
    freezeGroup(target);
    const tr=target.getBoundingClientRect();
    let left=e.clientX-tr.left-cardDrag.offX;
    let top=e.clientY-tr.top-cardDrag.offY;
    if(left<0)left=0;if(top<0)top=0;
    target.appendChild(cardDrag.card);
    cardDrag.card.style.position='absolute';
    cardDrag.card.style.left=Math.round(left)+'px';
    cardDrag.card.style.top=Math.round(top)+'px';
    cardDrag.card.classList.remove('dragging');
    cardDrag.card.style.zIndex='';
    if(cardDrag.moved){
      fitGroupHeight(source);
      if(target!==source)fitGroupHeight(target);
      setStatus(target!==source?'已移到「'+(sectionName(target)||'其他分类')+'」，记得保存':'已自由摆放，记得保存');
    }
    markCardDrop(null);
    document.body.classList.remove('cardmoving');
    cardDrag=null;
  },true);
  function clearDropMarks(){
    document.querySelectorAll('.dragover,.dropbefore,.dropafter,.dropinside')
      .forEach(x=>x.classList.remove('dragover','dropbefore','dropafter','dropinside'));
  }
  function branchDropMode(li,e){
    const r=li.getBoundingClientRect(), y=(e.clientY-r.top)/Math.max(r.height,1);
    if(y<.28) return 'before';
    if(y>.72) return 'after';
    return 'inside';
  }
  function canDropBranch(target){
    return dragType==='branch' && dragEl && target && target!==dragEl && !dragEl.contains(target);
  }
  function childListFor(li){
    let ul=Array.from(li.children).find(x=>x.tagName==='UL');
    if(!ul){ul=document.createElement('ul');li.appendChild(ul);}
    return ul;
  }
  function branchText(li){
    return Array.from(li.childNodes)
      .filter(n=>!(n.nodeType===1&&n.tagName==='UL'))
      .map(n=>n.textContent||'').join('')
      .replace(/✕|\+ 新增行/g,'').trim();
  }
  function moveBranch(target,e){
    const mode=branchDropMode(target,e);
    if(mode==='before') target.parentElement.insertBefore(dragEl,target);
    else if(mode==='after') target.parentElement.insertBefore(dragEl,target.nextSibling);
    else childListFor(target).appendChild(dragEl);
  }
  let branchMouse=null, branchGhost=null;
  document.addEventListener('mousedown',e=>{
    if(!layout||e.button!==0)return;
    const li=e.target.closest('.card li');
    if(!li)return;
    branchMouse={li,x:e.clientX,y:e.clientY,active:false};
    e.preventDefault();e.stopPropagation();
  },true);
  document.addEventListener('mousemove',e=>{
    if(!branchMouse)return;
    const moved=Math.abs(e.clientX-branchMouse.x)+Math.abs(e.clientY-branchMouse.y)>5;
    if(moved&&!branchMouse.active){
      dragEl=branchMouse.li;dragType='branch';branchMouse.active=true;dragEl.classList.add('dragging');
      branchGhost=document.createElement('div');branchGhost.className='branchghost';branchGhost.textContent=branchText(dragEl)||'枝条';
      document.body.appendChild(branchGhost);
    }
    if(!branchMouse.active)return;
    e.preventDefault();clearDropMarks();
    branchGhost.style.left=(e.clientX+12)+'px';branchGhost.style.top=(e.clientY+12)+'px';
    if(e.clientY>window.innerHeight-56)window.scrollBy(0,18);
    else if(e.clientY<56)window.scrollBy(0,-18);
    const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card li');
    if(canDropBranch(target))target.classList.add('drop'+branchDropMode(target,e));
  },true);
  document.addEventListener('mouseup',e=>{
    if(!branchMouse)return;
    if(branchMouse.active){
      e.preventDefault();
      const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card li');
      if(canDropBranch(target))moveBranch(target,e);
      if(dragEl)dragEl.classList.remove('dragging');
      if(branchGhost)branchGhost.remove();
      dragEl=null;dragType='';branchGhost=null;clearDropMarks();
    }
    branchMouse=null;
  },true);
  document.addEventListener('dragstart',e=>{
    if(!layout)return;
    const li=e.target.closest('.card li');
    if(li){
      dragEl=li;dragType='branch';li.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','branch');
      e.stopPropagation();
      return;
    }
    const c=e.target.closest('.card');
    if(c){
      dragEl=c;dragType='card';c.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','card');
    }
  });
  document.addEventListener('dragend',()=>{
    if(dragEl)dragEl.classList.remove('dragging');
    dragEl=null;dragType='';clearDropMarks();
  });
  document.addEventListener('dragover',e=>{
    if(!dragEl)return;
    const li=e.target.closest('.card li');
    if(canDropBranch(li)){
      e.preventDefault();e.stopPropagation();clearDropMarks();
      li.classList.add('drop'+branchDropMode(li,e));
      return;
    }
    if(dragType==='card'){
      const c=e.target.closest('.card');
      if(c&&c!==dragEl&&c.parentElement===dragEl.parentElement){
        e.preventDefault();clearDropMarks();c.classList.add('dragover');
      }
    }
  });
  document.addEventListener('drop',e=>{
    if(!dragEl)return;
    const li=e.target.closest('.card li');
    if(canDropBranch(li)){
      e.preventDefault();e.stopPropagation();
      moveBranch(li,e);
      clearDropMarks();
      return;
    }
    if(dragType==='card'){
      e.preventDefault();
      const c=e.target.closest('.card');
      if(c&&c!==dragEl&&c.parentElement===dragEl.parentElement){
        const r=c.getBoundingClientRect(), after=e.clientY>r.top+r.height/2;
        c.parentElement.insertBefore(dragEl,after?c.nextSibling:c);
      }
      clearDropMarks();
    }
  });
  function setStatus(t){document.getElementById('status').textContent=t;}

  // 自定义大字/小字颜色（写进 #content 内的 <style>，随云保存一起持久化）
  function setColor(){
    const big=document.getElementById('cBig').value, sm=document.getElementById('cSmall').value;
    let uc=document.getElementById('uc');
    if(!uc){uc=document.createElement('style');uc.id='uc';document.getElementById('content').prepend(uc);}
    uc.textContent=':root{--c-big:'+big+';--c-small:'+sm+'}';
  }
  function syncColorInputs(){
    const a=document.getElementById('cBig'), b=document.getElementById('cSmall');
    if(!a||!b) return;            // 已移除取色器时直接跳过
    const cs=getComputedStyle(document.documentElement);
    const big=(cs.getPropertyValue('--c-big')||'#e7ebf3').trim();
    const sm=(cs.getPropertyValue('--c-small')||'#828ea6').trim();
    const toHex=v=>{if(v[0]==='#'&&v.length===7)return v;const m=v.match(/\d+/g);return m?'#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join(''):v;};
    a.value=toHex(big); b.value=toHex(sm);
  }

  function focusEditable(el){
    if(!el) return;
    const range=document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  function activeEditField(){
    const sel=window.getSelection();
    const node=sel&&sel.rangeCount?sel.anchorNode:null;
    const el=node&&(node.nodeType===1?node:node.parentElement);
    return el&&el.closest?el.closest('.bigtext,.subnote'):null;
  }
  function ensureSubnote(li){
    let small=li.querySelector(':scope > .subnote');
    if(!small){
      small=makeSubnote();
      const del=li.querySelector(':scope > .del');
      li.insertBefore(small,del||null);
    }
    return small;
  }
  function makeSubnote(){
    const small=document.createElement('div');
    small.className='subnote ph';
    small.dataset.ph='小字说明（不填可空着）';
    small.dataset.keep='1';
    return small;
  }
  function normalizeRows(root=document,opts={}){
    const keepFresh=!!opts.keepFresh;
    const dropEmpty=!!opts.dropEmpty;
    const keepEditing=editing && !dropEmpty;
    const base=(root.matches&&root.matches('#content'))?root:(root.querySelector&&root.querySelector('#content'))||root;
    base.querySelectorAll('.subnote.ph').forEach(n=>{
      if(!n.textContent.trim() && !(keepEditing || (keepFresh && n.dataset.keep==='1'))) n.remove();
    });
    base.querySelectorAll('.bigtext.ph').forEach(n=>{
      if(!n.textContent.trim() && !keepEditing && n.closest('li')?.querySelector(':scope > .subnote')) n.remove();
    });
    base.querySelectorAll('ul.bul > li').forEach(li=>{
      if(li.querySelector(':scope > .bigtext,:scope > .subnote')) return;
      const del=li.querySelector(':scope > .del');
      const wy=li.querySelector(':scope > .wy');
      const big=document.createElement('div');
      big.className='bigtext';
      Array.from(li.childNodes).forEach(n=>{
        if(n===del || n===wy) return;
        big.appendChild(n);
      });
      const smallText=wy ? wy.textContent.replace(/^—\s*/,'').trim() : '';
      li.textContent='';
      li.appendChild(big);
      if(smallText){
        const small=document.createElement('div');
        small.className='subnote';
        small.textContent=smallText;
        li.appendChild(small);
      }
      if(del) li.appendChild(del);
    });
  }

  /* 编辑状态下：按住“⠿”移动，绕开 contenteditable 对原生拖拽的干扰 */
  let timelinePointer=null;
  function clearTimelineDrop(){document.querySelectorAll('.tl-drop-before,.tl-drop-after').forEach(x=>x.classList.remove('tl-drop-before','tl-drop-after'));}
  document.addEventListener('pointerdown',e=>{
    const handle=e.target.closest('.tl-drag');if(!editing||!handle)return;
    const item=handle.closest('.tl-module')||handle.closest('.tl-section');if(!item)return;
    timelinePointer={item,handle,x:e.clientX,y:e.clientY,target:null,after:false,active:false,pointerId:e.pointerId};
    handle.setPointerCapture?.(e.pointerId);e.preventDefault();e.stopPropagation();
  },true);
  document.addEventListener('pointermove',e=>{
    if(!timelinePointer)return;
    if(!timelinePointer.active&&Math.abs(e.clientX-timelinePointer.x)+Math.abs(e.clientY-timelinePointer.y)<6)return;
    timelinePointer.active=true;timelinePointer.item.classList.add('tl-pointer-dragging');
    const selector=timelinePointer.item.classList.contains('tl-section')?'.tl-section':'.tl-module';
    const under=document.elementFromPoint(e.clientX,e.clientY);
    const target=under?.closest(selector);
    clearTimelineDrop();timelinePointer.target=null;
    if(!target||target===timelinePointer.item||target.closest('.timeline-card')!==timelinePointer.item.closest('.timeline-card'))return;
    const after=e.clientY>target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;
    target.classList.add(after?'tl-drop-after':'tl-drop-before');
    timelinePointer.target=target;timelinePointer.after=after;e.preventDefault();e.stopPropagation();
  },true);
  document.addEventListener('pointerup',e=>{
    if(!timelinePointer)return;
    const {item,target,after,active}=timelinePointer;
    if(active&&target){
      target.parentElement.insertBefore(item,after?target.nextSibling:target);
      renumberTimeline(target.closest('.timeline-card'));setStatus('顺序已调整，记得保存');
    }
    item.classList.remove('tl-pointer-dragging');clearTimelineDrop();timelinePointer=null;
    if(active){e.preventDefault();e.stopPropagation();}
  },true);
  document.addEventListener('pointercancel',()=>{
    if(!timelinePointer)return;
    timelinePointer.item.classList.remove('tl-pointer-dragging');clearTimelineDrop();timelinePointer=null;
  },true);
  /* ===== 分类整组拖动：标题带着其后的全部卡片一起移动 ===== */
  let categoryPointer=null;
  function clearCategoryDrop(){
    document.querySelectorAll('h3.sec.catdropbefore,h3.sec.catdropafter').forEach(h=>h.classList.remove('catdropbefore','catdropafter'));
  }
  function categoryHeaderAt(x,y){
    const el=document.elementFromPoint(x,y);if(!el)return null;
    const direct=el.closest('h3.sec');if(direct)return direct;
    const cards=el.closest('.cards');
    if(cards&&cards.previousElementSibling?.matches('h3.sec'))return cards.previousElementSibling;
    return null;
  }
  function categoryBlockRect(h){
    let r=h.getBoundingClientRect(),bottom=r.bottom,n=h.nextElementSibling;
    while(n&&!(n.matches&&n.matches('h3.sec'))){bottom=Math.max(bottom,n.getBoundingClientRect().bottom);n=n.nextElementSibling;}
    return {top:r.top,bottom};
  }
  function categoryNodes(h){
    const nodes=[];let n=h;
    while(n&&(!nodes.length||!(n.matches&&n.matches('h3.sec')))){nodes.push(n);n=n.nextElementSibling;}
    return nodes;
  }
  function nextCategoryHeader(h){
    let n=h.nextElementSibling;
    while(n&&!(n.matches&&n.matches('h3.sec')))n=n.nextElementSibling;
    return n;
  }
  document.addEventListener('pointerdown',e=>{
    const handle=e.target.closest('.dragsec');if(!layout||!handle||e.button!==0)return;
    const source=handle.closest('h3.sec');if(!source)return;
    categoryPointer={source,handle,x:e.clientX,y:e.clientY,target:null,after:false,active:false,pointerId:e.pointerId};
    handle.setPointerCapture?.(e.pointerId);e.preventDefault();e.stopPropagation();
  },true);
  document.addEventListener('pointermove',e=>{
    if(!categoryPointer)return;
    if(!categoryPointer.active&&Math.abs(e.clientX-categoryPointer.x)+Math.abs(e.clientY-categoryPointer.y)<6)return;
    categoryPointer.active=true;categoryPointer.source.classList.add('catdragging');clearCategoryDrop();
    if(e.clientY>window.innerHeight-60)window.scrollBy(0,20);
    else if(e.clientY<72)window.scrollBy(0,-20);
    const target=categoryHeaderAt(e.clientX,e.clientY);categoryPointer.target=null;
    if(!target||target===categoryPointer.source)return;
    const r=categoryBlockRect(target),after=e.clientY>(r.top+r.bottom)/2;
    target.classList.add(after?'catdropafter':'catdropbefore');
    categoryPointer.target=target;categoryPointer.after=after;e.preventDefault();e.stopPropagation();
  },true);
  document.addEventListener('pointerup',e=>{
    if(!categoryPointer)return;
    const {source,target,after,active}=categoryPointer;
    if(active&&target){
      const parent=source.parentElement,frag=document.createDocumentFragment();
      categoryNodes(source).forEach(n=>frag.appendChild(n));
      const anchor=after?nextCategoryHeader(target):target;
      parent.insertBefore(frag,anchor||null);
      setStatus('分类及其全部卡片已整体移动，记得保存');
    }
    source.classList.remove('catdragging');clearCategoryDrop();categoryPointer=null;
    if(active){e.preventDefault();e.stopPropagation();}
  },true);
  document.addEventListener('pointercancel',()=>{
    if(!categoryPointer)return;
    categoryPointer.source.classList.remove('catdragging');clearCategoryDrop();categoryPointer=null;
  },true);

  /* ===== 分类（大标题）增 / 删 ===== */
  function sectionToolsHtml(){
    return '<button class="dragsec" contenteditable="false">⠿ 拖分类</button> '+
      '<button class="delsec" contenteditable="false" onclick="delSection(this)">删分类</button>';
  }
  function ensureSectionControls(){
    document.querySelectorAll('#content h3.sec').forEach(h=>{
      let t=h.querySelector(':scope > .sectools');
      if(!t){t=document.createElement('span');t.className='sectools';t.contentEditable='false';h.appendChild(t);}
      t.innerHTML=sectionToolsHtml();
    });
  }
  function addSection(){
    ensureCardControls();
    const content=document.getElementById('content');
    const h=document.createElement('h3');
    h.className='sec';
    h.appendChild(document.createTextNode('新分类标题'));
    const t=document.createElement('span');
    t.className='sectools'; t.contentEditable='false';
    t.innerHTML=sectionToolsHtml();
    h.appendChild(t);
    const cards=document.createElement('div');
    cards.className='cards';
    cards.appendChild(makeCardEl());
    content.appendChild(h);
    content.appendChild(cards);
    syncLayoutDraggables();
    h.scrollIntoView({behavior:'smooth',block:'center'});
    setStatus('已新增分类，记得保存');
  }
  function delSection(btn){
    const h=btn.closest('h3.sec');
    if(!h) return;
    const title=(h.textContent||'').replace(/⠿ 拖分类|删分类/g,'').trim()||'这个分类';
    if(!confirm('删除分类「'+title+'」及其下所有卡片？')) return;
    let n=h.nextElementSibling;
    while(n && !(n.tagName==='H3'&&n.classList.contains('sec'))){
      const next=n.nextElementSibling; n.remove(); n=next;
    }
    h.remove();
    setStatus('已删除分类，记得保存');
  }
  function delCard(btn){
    const card=btn.closest('.card');
    if(!card) return;
    const title=card.querySelector('.ti')?.textContent.trim()||'这张卡片';
    if(!confirm('删除「'+title+'」？')) return;
    card.remove();
    setStatus('已删除卡片，记得保存');
  }

  function ensureImageLightbox(){
    if(document.getElementById('imgLightbox')) return;
    const lb=document.createElement('div');
    lb.id='imgLightbox';
    lb.className='imglightbox';
    lb.innerHTML='<button class="close" contenteditable="false">关闭</button><img alt="">';
    document.body.appendChild(lb);
    lb.addEventListener('click',e=>{if(e.target===lb||e.target.classList.contains('close'))lb.classList.remove('on');});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('on');});
  }
  function openImageLightbox(img){
    ensureImageLightbox();
    const lb=document.getElementById('imgLightbox');
    lb.querySelector('img').src=img.currentSrc||img.src;
    lb.classList.add('on');
  }
  function imageToolsHtml(){
    return '<div class="imgtools" contenteditable="false">'+
      '<button onclick="setImageMode(this,\'thumb\')" contenteditable="false">缩略</button>'+
      '<button onclick="setImageMode(this,\'fit\')" contenteditable="false">适宽</button>'+
      '<button onclick="setImageMode(this,\'natural\')" contenteditable="false">原图</button>'+
      '</div>';
  }
  function imageHandlesHtml(){
    return ['n','s','e','w','nw','ne','sw','se'].map(d=>'<i class="imghandle '+d+'" data-dir="'+d+'" contenteditable="false"></i>').join('');
  }
  function enhanceImages(root=document){
    ensureImageLightbox();
    root.querySelectorAll('#content img').forEach(img=>{
      if(img.closest('.imglightbox')) return;
      let box=img.closest('.imgbox');
      if(!box){
        box=document.createElement('span');
        box.className='imgbox thumb';
        box.contentEditable='false';
        img.parentNode.insertBefore(box,img);
        box.appendChild(img);
      }
      img.removeAttribute('width');
      img.removeAttribute('height');
      img.dataset.imgEnhanced='1';
      if(window.queueOCR) window.queueOCR(img);
      if(!box.querySelector(':scope > .imgtools')) box.insertAdjacentHTML('afterbegin',imageToolsHtml());
      if(!box.querySelector(':scope > .imghandle')) box.insertAdjacentHTML('beforeend',imageHandlesHtml());
    });
  }
  function setImageMode(btn,mode){
    const box=btn.closest('.imgbox');
    if(!box) return;
    box.classList.remove('thumb','fit');
    if(mode==='thumb'){
      box.classList.add('thumb');
      box.style.width='160px';
      box.style.height='110px';
    }else if(mode==='fit'){
      box.classList.add('fit');
      box.style.width='100%';
      box.style.height='';
    }else{
      box.style.width='';
      box.style.height='';
    }
    setStatus('图片尺寸已调整，记得保存');
  }
  let imgResize=null;
  document.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.imghandle');
    if(!h||!editing) return;
    const box=h.closest('.imgbox');
    const r=box.getBoundingClientRect();
    imgResize={box,dir:h.dataset.dir,x:e.clientX,y:e.clientY,w:r.width,h:r.height};
    box.classList.remove('thumb','fit');
    box.style.width=r.width+'px';
    box.style.height=r.height+'px';
    h.setPointerCapture?.(e.pointerId);
    e.preventDefault();
    e.stopPropagation();
  },true);
  document.addEventListener('pointermove',e=>{
    if(!imgResize) return;
    const dx=e.clientX-imgResize.x, dy=e.clientY-imgResize.y, dir=imgResize.dir;
    let w=imgResize.w, h=imgResize.h;
    if(dir.includes('e')) w=imgResize.w+dx;
    if(dir.includes('w')) w=imgResize.w-dx;
    if(dir.includes('s')) h=imgResize.h+dy;
    if(dir.includes('n')) h=imgResize.h-dy;
    imgResize.box.style.width=Math.max(72,Math.round(w))+'px';
    imgResize.box.style.height=Math.max(54,Math.round(h))+'px';
    e.preventDefault();
  },true);
  document.addEventListener('pointerup',()=>{
    if(imgResize) setStatus('图片尺寸已调整，记得保存');
    imgResize=null;
  },true);
  document.addEventListener('click',e=>{
    const img=e.target.closest('.imgbox img');
    if(!img) return;
    if(e.target.closest('.imgtools')||e.target.closest('.imghandle')) return;
    if(!editing) openImageLightbox(img);
  });
  document.addEventListener('paste',()=>setTimeout(()=>enhanceImages(document),80));
  document.addEventListener('input',e=>{
    if(e.target&&e.target.closest&&e.target.closest('#content')) setTimeout(()=>enhanceImages(document),80);
  });

  // ☁️ GitHub 即云端：程序(index.html) 与 内容(content.html) 分离
  //   打开 → 从 GitHub API 拉最新 content.html（绕开 Pages 缓存，B 几秒见到 A 的更新）
  //   保存 → 只把 content.html 提交到 GitHub（不再连程序一起传，省一半流量）
  const GH={owner:'wdcwdjln',repo:'touliu-kanban',path:'content.html',branch:'main'};
  const TK_KEY='gh_token';
  function ghHeaders(t){return {Authorization:'Bearer '+t,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
  function b64(str){return btoa(unescape(encodeURIComponent(str)));}
  function unb64(b){return decodeURIComponent(escape(atob((b||'').replace(/\s/g,''))));}
  async function loadFromGitHub(){
    try{localStorage.removeItem('touliu_outline_v5');}catch(e){}
    setStatus('载入中…');
    try{
      const url='https://raw.githubusercontent.com/'+GH.owner+'/'+GH.repo+'/'+GH.branch+'/'+GH.path+'?_='+Date.now();
      const r=await fetch(url,{cache:'no-store'});
      if(!r.ok)throw new Error('GitHub '+r.status);
      const text=await r.text();
      document.getElementById('content').innerHTML=text;
      normalizeRows();ensureCardControls();ensureSectionControls();ensureTimelineControls();enhanceImages(document);syncLayoutDraggables();syncColorInputs();
      setStatus('已载入 '+time());
    }catch(e){ setStatus('载入失败：'+e.message+'（点重载重试）'); }
  }
  async function saveCloud(){
    normalizeRows(document,{dropEmpty:true});
    let t=localStorage.getItem(TK_KEY);
    if(!t){ t=(prompt('首次保存：粘贴你的 GitHub 令牌（只存在你这台浏览器，不会写进页面）')||'').trim(); if(!t)return; localStorage.setItem(TK_KEY,t); }
    setStatus('保存中…');
    try{
      const api='https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path;
      const meta=await fetch(api+'?ref='+GH.branch,{headers:ghHeaders(t)});
      if(meta.status===401||meta.status===403){localStorage.removeItem(TK_KEY);setStatus('令牌无效/越权，已清除，请重新点保存输入');return;}
      const sha=meta.ok?(await meta.json()).sha:undefined;
      const snap=document.getElementById('content').cloneNode(true);
      snap.querySelectorAll('.sectools').forEach(x=>x.remove());
      snap.querySelectorAll('.timeline-card [data-ph]').forEach(x=>x.setAttribute('contenteditable','false'));
      snap.querySelectorAll('.tl-stylepanel').forEach(x=>x.classList.remove('open'));
      snap.querySelectorAll('.tl-drop-before,.tl-drop-after').forEach(x=>x.classList.remove('tl-drop-before','tl-drop-after'));
      snap.querySelectorAll('.search-hit,.search-dim,.search-texthit,.search-imghit').forEach(x=>x.classList.remove('search-hit','search-dim','search-texthit','search-imghit'));
      const data=snap.innerHTML;
      const body={message:'更新看板内容 '+new Date().toLocaleString('zh-CN'),content:b64(data),branch:GH.branch};
      if(sha)body.sha=sha;
      const put=await fetch(api,{method:'PUT',headers:ghHeaders(t),body:JSON.stringify(body)});
      if(put.ok){setStatus('✅ 已存 GitHub '+time());}
      else{const er=await put.json().catch(function(){return {};});setStatus('保存失败：'+(er.message||put.status));}
    }catch(e){setStatus('保存出错：'+e.message);}
  }
  function time(){const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
  // 粘贴只插纯文本：落进哪个框就自动套那个框的字号/颜色（大字框=大字，小字框=小字）；图片粘贴照旧
  document.getElementById('content').addEventListener('paste',function(e){
    const dt=e.clipboardData;if(!dt)return;
    const types=Array.prototype.slice.call(dt.types||[]);
    if((dt.files&&dt.files.length)||types.indexOf('Files')>-1)return;
    const text=dt.getData('text/plain');
    if(text==null)return;
    e.preventDefault();
    document.execCommand('insertText',false,text);
    setTimeout(()=>normalizeRows(document,{keepFresh:true}),0);
  });
  document.getElementById('content').addEventListener('keydown',function(e){
    if(e.key!=='Enter'||!editing) return;
    const field=activeEditField();
    if(field&&field.classList.contains('bigtext')){
      e.preventDefault();
      focusEditable(ensureSubnote(field.closest('li')));
      return;
    }
    if(field&&field.classList.contains('subnote')){
      e.preventDefault();
      const li=field.closest('li');
      const next=makeSubnote();
      li.insertBefore(next,field.nextElementSibling&&field.nextElementSibling.classList.contains('subnote')?field.nextElementSibling:null);
      if(!next.nextSibling){
        const del=li.querySelector(':scope > .del');
        if(del) li.insertBefore(next,del);
      }
      focusEditable(next);
    }
  });
  document.getElementById('content').addEventListener('input',function(){setTimeout(()=>normalizeRows(document,{keepFresh:true}),0);});
  /* ===== 🔍 搜索（卡片文字 + 图片OCR文字）+ 图片自动OCR ===== */
  (function(){
    const ocrPending=new WeakSet();
    let ocrQueue=[], ocrBusy=false, ocrEnabled=false, ocrWorker=null, ocrWorkerP=null;
    function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('加载失败'));document.head.appendChild(s);});}
    async function getWorker(){
      if(ocrWorker)return ocrWorker;
      if(ocrWorkerP)return ocrWorkerP;
      ocrWorkerP=(async()=>{
        if(!window.Tesseract){setStatus('首次搜图：下载OCR中文包（约几MB，仅一次）…');await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');}
        ocrWorker=await Tesseract.createWorker('chi_sim');
        return ocrWorker;
      })();
      return ocrWorkerP;
    }
    window.queueOCR=function(img){
      if(!img||img.dataset.ocr!==undefined)return;   // 已OCR过（含从云端content.html读到的）→ 跳过
      if(ocrPending.has(img))return;
      ocrPending.add(img);ocrQueue.push(img);
      if(ocrEnabled)runQueue();
    };
    function enableOCR(){ocrEnabled=true;if(ocrQueue.length)runQueue();}
    async function runQueue(){
      if(ocrBusy)return;ocrBusy=true;
      try{
        const w=await getWorker();
        while(ocrQueue.length){
          const img=ocrQueue.shift();
          try{const r=await w.recognize(img.src);img.dataset.ocr=(r.data.text||'').replace(/\s+/g,' ').trim();}
          catch(e){img.dataset.ocr='';}
          ocrPending.delete(img);
          refreshIfSearching();
        }
        setStatus('图片文字已识别，可搜索（记得点☁️保存永久保留）');
      }catch(e){setStatus('OCR出错：'+e.message);}
      ocrBusy=false;
    }
    function norm(s){return (s||'').toLowerCase().replace(/\s+/g,'');}   // 去所有空格：中文OCR会在字间插空格，搜"追投"才能匹配"追 投"
    const BTN=/删除卡片|新增行|删分类|缩略|适宽|原图|关闭|✕|＋/g;      // 按钮文字，搜索时滤掉免得噪音
    function cardHay(c){let t=(c.textContent||'').replace(BTN,'');c.querySelectorAll('img[data-ocr]').forEach(i=>{t+=' '+i.dataset.ocr;});return norm(t);}
    function clearMarks(){
      document.querySelectorAll('#content .search-hit,#content .search-dim').forEach(c=>c.classList.remove('search-hit','search-dim'));
      document.querySelectorAll('#content .search-texthit').forEach(e=>e.classList.remove('search-texthit'));
      document.querySelectorAll('#content .search-imghit').forEach(e=>e.classList.remove('search-imghit'));
    }
    let firstHit=null;
    window.doSearch=function(q){
      q=norm(q);
      const cnt=document.getElementById('searchCount');
      clearMarks();firstHit=null;
      if(!q){if(cnt)cnt.textContent='';return;}
      enableOCR();                                   // 一开搜就把没OCR的图补上
      let n=0;
      document.querySelectorAll('#content .card').forEach(c=>{
        const hit=cardHay(c).indexOf(q)>-1;           // 整卡命中判定，不漏卡
        c.classList.toggle('search-hit',hit);
        c.classList.toggle('search-dim',!hit);
        if(!hit)return;
        n++;
        c.querySelectorAll('*').forEach(el=>{          // 扫最小文字叶子，命中就点亮那一处
          if(el.children.length||el.closest('.cardtools,.imgtools,.imghandle'))return;
          if(el.matches('.del,.addrow,.delcard,button,i'))return;
          if(norm(el.textContent).indexOf(q)>-1){el.classList.add('search-texthit');if(!firstHit)firstHit=el;}
        });
        c.querySelectorAll('img[data-ocr]').forEach(img=>{ // 命中的图加金框
          if(norm(img.dataset.ocr).indexOf(q)>-1){const bx=img.closest('.imgbox')||img;bx.classList.add('search-imghit');if(!firstHit)firstHit=bx;}
        });
        if(!firstHit)firstHit=c;                       // 兜底：文字跨元素时至少定位到卡
      });
      if(cnt)cnt.textContent='找到 '+n+' 张'+(n?'（回车跳到第一处）':'');
    };
    window.clearSearch=function(){
      clearMarks();firstHit=null;
      const b=document.getElementById('searchBox');if(b)b.value='';
      const cnt=document.getElementById('searchCount');if(cnt)cnt.textContent='';
    };
    function refreshIfSearching(){const b=document.getElementById('searchBox');if(b&&b.value.trim())window.doSearch(b.value);}
    document.addEventListener('paste',()=>setTimeout(enableOCR,150));   // 贴新图 → 自动OCR
    const sb=document.getElementById('searchBox');
    if(sb)sb.addEventListener('keydown',e=>{
      if(e.key==='Escape')window.clearSearch();
      else if(e.key==='Enter'&&firstHit)firstHit.scrollIntoView({behavior:'smooth',block:'center'});
    });
  })();

  loadFromGitHub();
</script>
